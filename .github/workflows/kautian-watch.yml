name: Kautian watch

# Weekly check whether MoE has published a new 教典 export
# (https://sutian.moe.edu.tw/media/senn/ods/kautian.ods). Compares the export's
# data rows with the committed capture, ignoring packaging, styles and ordering.
# Maintains one issue with counts, examples and full report artifacts.
# Refresh steps: dictionary/docs/SOURCES.md § kautian.
on:
  schedule:
    - cron: '0 1 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: kautian-watch
  cancel-in-progress: false

env:
  KAUTIAN_URL: https://sutian.moe.edu.tw/media/senn/ods/kautian.ods
  KAUTIAN_PATH: dictionary/sources/official/kautian/data/raw/kautian.ods

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            ${{ env.KAUTIAN_PATH }}
            tools/kautian_watch.py
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      # --insecure: the publisher's TLS certificate expired 2026-10-08. The download
      # is only parsed and compared, never committed or built; refreshing the capture
      # is a manual step.
      - name: Download upstream export
        run: |
          curl --fail --silent --show-error --insecure --max-time 300 \
            --dump-header upstream.headers --output upstream.ods "$KAUTIAN_URL"

      - name: Compare with committed capture
        run: |
          python tools/kautian_watch.py compare "$KAUTIAN_PATH" upstream.ods \
            --baseline-commit "$GITHUB_SHA" --output report

      - name: Upload full diff
        id: report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kautian-diff
          path: report/
          if-no-files-found: error
          retention-days: 90

      # Also runs on no-change comparisons to clear a stale report after a
      # capture refresh. Existing human text and comments remain intact.
      - name: Create or update issue
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_URL: ${{ steps.report.outputs.artifact-url }}
        run: |
          last_modified=$(awk 'tolower($1) == "last-modified:" {$1=""; sub(/^ /, ""); sub(/\r$/, ""); print}' upstream.headers)
          python tools/kautian_watch.py publish --repo "$GITHUB_REPOSITORY" \
            --report report --artifact-url "$ARTIFACT_URL" \
            --last-modified "${last_modified:-unknown}" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
